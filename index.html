<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rotating Mars</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #msg { position: absolute; left: 12px; bottom: 10px; color: #c96; font: 14px sans-serif; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="msg"></div>

<!-- Generated by make_live.py -->
<script src="texture.js"></script>
<script src="relief.js"></script>

<script>
"use strict";

// ------------------------------------------------------------
// Settings (override from the URL: index.html?period=2&tilt=15,
// or from the "Customise" panel of Lively Wallpaper)
// ------------------------------------------------------------
const settings = {
  period: 10,     // minutes per full rotation
  zoom: 0.45,     // globe radius as a fraction of the screen height
  offsetX: 0,     // globe position, % of screen height: left (-) / right (+)
  offsetY: 0,     // same: down (-) / up (+)
  sunAz: -55,     // degrees; sun direction, negative = left of the camera
  sunEl: 12,      // degrees; positive = sun above the screen plane
  relief: 3,      // terrain exaggeration (0 = smooth, 1 = true slopes)
  atmosphere: 1,  // haze and limb glow strength
  stars: 1,       // star field brightness
  distance: 3,    // camera distance from the centre, in radii (large = distant, flatter view)
  tilt: 20,       // degrees; positive = north pole towards the viewer
  roll: 18,       // degrees; positive = rotation axis leaning to the right
  fps: 30,        // frames per second (0 = uncapped)
  lon: -70,       // central longitude at start (Valles Marineris)
};
for (const [k, v] of new URLSearchParams(location.search)) {
  if (k in settings && isFinite(parseFloat(v))) settings[k] = parseFloat(v);
}

// Called by Lively Wallpaper (see LivelyProperties.json)
function livelyPropertyListener(name, val) {
  if (name in settings) {
    syncRotation();
    settings[name] = Number(val);
    needsDraw = true;
  }
}

const canvas = document.getElementById("view");
const msg = document.getElementById("msg");

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(innerWidth * dpr));
  canvas.height = Math.max(1, Math.round(innerHeight * dpr));
  needsDraw = true;
}

// ------------------------------------------------------------
// WebGL: for each pixel, a ray leaves the camera and we compute where it
// hits the sphere (no mesh: the sphere is exact).
// ------------------------------------------------------------
const VS = `#version 300 es
in vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;

const FS = `#version 300 es
precision highp float;
uniform sampler2D uTex;      // surface colour (Viking mosaic)
uniform sampler2D uRelief;   // east/north terrain slopes (MOLA altimetry)
uniform vec2 uCenter;        // globe centre, canvas pixels (y up)
uniform float uRadius;       // apparent radius in pixels
uniform float uScale;        // canvas pixels per reference pixel (2160-high screen)
uniform float uLon;          // central longitude, in turns
uniform float uTilt;         // radians
uniform float uRoll;         // radians
uniform float uDist;         // camera distance from the centre, in radii
uniform vec3 uSun;           // sun direction, screen frame
uniform float uReliefK;      // terrain exaggeration
uniform float uAtmo;
uniform float uStars;
uniform float uSlopeMax;
out vec4 outColor;

const float PI = 3.14159265358979;
const float ATMO_HEIGHT = 0.006;                    // scale height, in radii (about 2x exaggerated)
const vec3 DUST = vec3(0.95, 0.66, 0.42);           // sunlit dust haze
const vec3 TWILIGHT = vec3(0.42, 0.52, 0.78);       // Martian twilights are bluish
const vec3 SUNLIGHT = vec3(1.0, 0.96, 0.90);

// Screen frame -> planet frame (rotation axis = y).
// The axis leans in the screen plane (roll), then towards the viewer (tilt).
vec3 toPlanet(vec3 a) {
  float cr = cos(uRoll), sr = sin(uRoll);
  vec2 q = vec2(a.x * cr - a.y * sr, a.x * sr + a.y * cr);
  float c = cos(uTilt), s = sin(uTilt);
  return vec3(q.x, q.y * c + a.z * s, -q.y * s + a.z * c);
}

float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

// At most one star per 48-pixel cell
vec3 starField(vec2 q) {
  const float CELL = 48.0;
  vec2 cell = floor(q / CELL);
  if (hash(cell) > 0.42) return vec3(0.0);
  vec2 pos = (cell + 0.15 + 0.7 * vec2(hash(cell + 17.3), hash(cell + 41.7))) * CELL;
  float mag = pow(hash(cell + 73.1), 7.0);          // many faint stars, few bright ones
  float sigma = 0.75 + 1.1 * mag;
  vec2 dq = q - pos;
  float core = exp(-dot(dq, dq) / (2.0 * sigma * sigma));
  float t = hash(cell + 5.9);                       // temperature: bluish -> orange
  vec3 tint = mix(vec3(0.75, 0.84, 1.0), vec3(1.0, 0.86, 0.70), t);
  return tint * core * (0.10 + 1.3 * mag);
}

void main() {
  // p: position in the image; the visible edge of the globe (the horizon) is at |p| = 1
  vec2 p = (gl_FragCoord.xy - uCenter) / uRadius;
  float r = length(p);

  // Ray from the camera, intersected with the unit sphere
  float c2 = uDist * uDist - 1.0;
  vec3 o = vec3(0.0, 0.0, uDist);
  vec3 ray = normalize(vec3(p / sqrt(c2), -1.0));
  float b = dot(o, ray);
  vec3 n = normalize(o + (-b - sqrt(max(b * b - c2, 0.0))) * ray);   // hit point = normal
  vec3 m = toPlanet(n);
  vec3 sunP = toPlanet(uSun);

  // ---- Texture coordinates ----
  float lat = asin(clamp(m.y, -1.0, 1.0));
  float u = atan(m.x, m.z) / (2.0 * PI) + 0.5 + uLon;
  float v = 0.5 - lat / PI;
  // atan() jumps from -PI to +PI behind the pole: take the derivatives from
  // whichever variant of u is continuous there.
  float u2 = fract(u + 0.5) - 0.5;
  vec2 t = fwidth(u) <= fwidth(u2) ? vec2(u, v) : vec2(u2, v);
  vec2 gx = dFdx(t), gy = dFdy(t);
  vec3 albedo = textureGrad(uTex, vec2(u, v), gx, gy).rgb;
  vec2 enc = textureGrad(uRelief, vec2(u, v), gx, gy).rg * 2.0 - 1.0;

  // ---- Relief: the normal is tipped by the terrain slopes ----
  vec2 slope = uSlopeMax * enc * abs(enc) * uReliefK;
  vec3 east = normalize(vec3(m.z, 0.0, -m.x) + vec3(1e-5, 0.0, 0.0));
  vec3 north = cross(m, east);
  vec3 nRelief = normalize(m - slope.x * east - slope.y * north);

  // ---- Lighting ----
  float sunSmooth = dot(m, sunP);                  // sun height over the smooth sphere
  float sunRelief = dot(nRelief, sunP);            // same over the real terrain
  float day = smoothstep(-0.10, 0.14, sunSmooth);  // soft twilight
  float light = pow(max(sunRelief, 0.0), 0.8) * day;
  // Near the terminator sunlight crosses more dust and reddens
  vec3 sunCol = mix(vec3(1.0, 0.62, 0.40), SUNLIGHT, smoothstep(0.0, 0.45, sunSmooth));
  vec3 surface = albedo * 1.45 * (sunCol * light + vec3(0.006, 0.007, 0.011));

  // Haze: the more grazing the view, the more atmosphere it crosses
  float mu = max(dot(n, -ray), 0.02);
  float haze = uAtmo * (1.0 - exp(-0.035 / mu));
  float hazeLit = smoothstep(-0.18, 0.25, sunSmooth);
  vec3 hazeCol = mix(TWILIGHT, DUST, smoothstep(0.0, 0.40, sunSmooth)) * hazeLit;
  surface = surface * (1.0 - 0.6 * haze) + hazeCol * haze;

  // ---- Off the disc: stars and atmosphere glow ----
  vec3 closest = o - b * ray;                      // point of the ray nearest the centre
  float altitude = max(length(closest) - 1.0, 0.0);
  float limbSun = dot(normalize(closest), uSun);
  vec3 glowCol = mix(TWILIGHT, DUST, smoothstep(0.0, 0.40, limbSun)) * smoothstep(-0.18, 0.25, limbSun);
  vec3 space = starField(gl_FragCoord.xy / uScale) * uStars
             + glowCol * uAtmo * 0.75 * exp(-altitude / ATMO_HEIGHT);

  float aa = 1.5 / uRadius;
  float inside = 1.0 - smoothstep(1.0 - aa, 1.0 + aa, r);
  vec3 col = mix(space, surface, inside);
  // Slight noise to avoid banding in dark gradients (8 bits per channel)
  col += (hash(gl_FragCoord.xy + 0.5) - 0.5) / 255.0;
  outColor = vec4(col, 1.0);
}`;

const gl = canvas.getContext("webgl2", { antialias: false, alpha: false, powerPreference: "high-performance" });
let uni = null;
let texReady = false;
let needsDraw = true;

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}

function initGL() {
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  uni = {};
  for (const name of ["uTex", "uRelief", "uCenter", "uRadius", "uScale", "uLon", "uTilt", "uRoll",
                      "uDist", "uSun", "uReliefK", "uAtmo", "uStars", "uSlopeMax"]) {
    uni[name] = gl.getUniformLocation(prog, name);
  }
}

// Equirectangular map embedded as base64 -> texture on the given unit.
// (A page opened from file:// cannot load an image file into WebGL.)
async function loadMap(data, unit) {
  const bin = atob(data.jpegBase64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const blob = new Blob([bytes], { type: "image/jpeg" });

  // Shrink if the GPU does not accept a texture this wide
  const maxSize = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  const opts = { colorSpaceConversion: "none" };
  if (data.width > maxSize) {
    opts.resizeWidth = maxSize;
    opts.resizeHeight = Math.round(data.height * maxSize / data.width);
    opts.resizeQuality = "high";
  }
  const bmp = await createImageBitmap(blob, opts);

  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, bmp);
  bmp.close();
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  const aniso = gl.getExtension("EXT_texture_filter_anisotropic");
  if (aniso) {
    gl.texParameterf(gl.TEXTURE_2D, aniso.TEXTURE_MAX_ANISOTROPY_EXT,
      Math.min(8, gl.getParameter(aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
  }
}

async function loadTextures() {
  await loadMap(window.MARS_TEXTURE, 0);
  await loadMap(window.MARS_RELIEF, 1);
  // The base64 strings are no longer needed: free the memory
  window.MARS_TEXTURE.jpegBase64 = window.MARS_RELIEF.jpegBase64 = null;
  gl.uniform1i(uni.uTex, 0);
  gl.uniform1i(uni.uRelief, 1);
  gl.uniform1f(uni.uSlopeMax, window.MARS_RELIEF.slopeMax);
  texReady = true;
  needsDraw = true;
}

// ------------------------------------------------------------
// Animation
// ------------------------------------------------------------
// Mars spins west to east: with north up, the terrain moves left to right,
// so the central longitude decreases.
let turns = 0;                 // turns completed since start
let lastSync = performance.now();

function syncRotation() {
  const now = performance.now();
  if (settings.period > 0) turns += (now - lastSync) / (settings.period * 60000);
  turns -= Math.floor(turns);
  lastSync = now;
}

function draw() {
  syncRotation();
  const rad = Math.PI / 180;
  const h = canvas.height;
  gl.viewport(0, 0, canvas.width, h);
  gl.uniform2f(uni.uCenter,
    canvas.width / 2 + settings.offsetX / 100 * h,
    h / 2 + settings.offsetY / 100 * h);
  gl.uniform1f(uni.uRadius, Math.max(1, settings.zoom * h));
  gl.uniform1f(uni.uScale, h / 2160);
  const lon = settings.lon / 360 - turns;
  gl.uniform1f(uni.uLon, lon - Math.floor(lon));
  gl.uniform1f(uni.uTilt, settings.tilt * rad);
  gl.uniform1f(uni.uRoll, settings.roll * rad);
  gl.uniform1f(uni.uDist, Math.max(1.05, settings.distance));
  const az = settings.sunAz * rad, el = settings.sunEl * rad;
  gl.uniform3f(uni.uSun, Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
  gl.uniform1f(uni.uReliefK, settings.relief);
  gl.uniform1f(uni.uAtmo, settings.atmosphere);
  gl.uniform1f(uni.uStars, settings.stars);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

let lastFrame = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (!texReady) return;
  const interval = settings.fps > 0 ? 1000 / settings.fps : 0;
  // Small tolerance so a frame is not skipped when rAF fires just before the deadline
  if (!needsDraw && now - lastFrame < interval - 2) return;
  lastFrame = now;
  needsDraw = false;
  draw();
}

function fail(e) {
  console.error(e);
  msg.textContent = "Mars: " + (e && e.message ? e.message : e);
}

if (!gl) {
  fail("WebGL2 is not available");
} else {
  try {
    initGL();
    resize();
    addEventListener("resize", resize);
    loadTextures().catch(fail);
    requestAnimationFrame(frame);
  } catch (e) {
    fail(e);
  }
}
</script>
</body>
</html>
